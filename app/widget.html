<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RM PMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<style>
:root{
  --bg:#fafafa; --surface:#fff; --surface-muted:#f5f5f5; --border:#e5e5e5; --border-strong:#d4d4d4;
  --text:#171717; --sub:#525252; --brand:#0a0777; --brand-soft:#e0e7ff; --accent:#fb6e44;
  --ok:#15803d; --ok-bg:#f0fdf4; --bad:#b91c1c; --bad-bg:#fef2f2; --warn:#a16207; --warn-bg:#fefce8; --rev:#7c2d12; --rev-bg:#ffedd5;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Poppins",system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:14px}
button,select,input{font-family:inherit;font-size:14px}
a{color:var(--brand)} a:hover{color:#4338ca}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{background:var(--brand);color:#fff;padding:0 32px;position:sticky;top:0;z-index:5}
.bar{max-width:1376px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:24px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;font-size:20px}
.brand .tag{font-size:12px;padding:2px 8px;border:1px solid rgba(255,255,255,.4);border-radius:999px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{background:transparent;border:0;color:#e0e7ff;padding:10px 14px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.hright{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hright input[type=search]{width:300px;height:40px;border-radius:8px;border:0;padding:0 14px}
.hright label.t{display:flex;gap:6px;align-items:center;font-size:13px;color:#e0e7ff}
main{max-width:1376px;margin:0 auto;padding:28px 32px 48px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
h1{margin:0;font-size:30px;font-weight:600;color:var(--brand)}
h2{margin:0 0 4px;font-size:18px;font-weight:600}
.sub{margin:4px 0 16px;font-size:13px;color:var(--sub)}
.top .sub{margin:6px 0 0;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.kpi .l{margin:0;font-size:13px;color:var(--sub)} .kpi .v{margin:6px 0 0;font-size:30px;font-weight:600;color:var(--brand)} .kpi .n{margin:4px 0 0;font-size:12px;color:var(--sub)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:24px;align-items:start}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px;align-items:start}
ul.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.todo li{display:flex;gap:12px;align-items:center;padding:12px;border-radius:8px;background:var(--surface-muted)}
ul.todo li.l0{background:var(--bad-bg)} ul.todo li.l1{background:var(--warn-bg)}
ul.todo li .t{flex:1}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.p-urgent{background:var(--bad);color:#fff}.p-week{background:#fde047;color:#713f12}.p-fin{background:var(--border);color:var(--text)}
.p-ok{background:var(--ok);color:#fff}.p-bad{background:var(--bad);color:#fff}.p-rev{background:var(--rev-bg);color:var(--rev)}.p-plan{background:var(--brand-soft);color:var(--brand)}
.linkbtn{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;text-decoration:underline;padding:4px}
.btn{height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.navy{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:500;color:var(--sub);padding:8px}
td{padding:10px 8px;border-top:1px solid var(--border);vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
.yes{color:var(--ok);font-weight:600}.no{color:var(--bad);font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.col{background:var(--surface-muted);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.col h3{margin:0;font-size:13px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:left;cursor:pointer;width:100%}
.card b{display:block;font-size:14px}.card span{display:block;margin-top:2px;font-size:12px;color:var(--sub)}
.card span.bad{color:var(--bad)}.card span.warn{color:var(--warn)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;font-size:12px}
.steps li{padding:10px;border-radius:8px;background:var(--surface-muted);color:var(--sub)}
.steps li.done{background:var(--brand-soft);color:var(--brand)}.steps li.cur{background:var(--brand);color:#fff;font-weight:600}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--surface-muted)}
.checks li.on{background:var(--ok-bg)}
.checks label{display:flex;gap:10px;align-items:center;cursor:pointer;flex:1}
.checks input{width:18px;height:18px;accent-color:var(--ok)}
.checks .st{font-weight:600;font-size:13px}
.money{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.money div{padding:12px;border-radius:8px;background:var(--surface-muted)}
.money .l{margin:0;font-size:12px;color:var(--sub)}.money .v{margin:4px 0 0;font-size:22px;font-weight:600}
.box{margin-top:12px;padding:12px;border-radius:8px;border:1px solid var(--border)}
.links{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:8px}
.minor{font-size:12px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--sub)}
.chips span.c{padding:3px 10px;border:1px solid var(--border);border-radius:999px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:9}
.err{background:var(--bad-bg);color:var(--bad);padding:12px;border-radius:8px;display:none}
.empty{color:var(--sub);margin:0}
.sel{height:44px;border-radius:8px;border:1px solid var(--border-strong);padding:0 10px;background:#fff}
.vh{position:absolute;left:-9999px}
.banner{padding:12px 16px;border-radius:10px;background:var(--warn-bg);color:#713f12;border:1px solid #fde68a;font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.fchip{border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--text)}
.fchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.fsep{width:1px;background:var(--border);margin:0 4px}
.due{font-size:12px;font-weight:600;white-space:nowrap}
.due.over{color:var(--bad)}.due.soon{color:var(--warn)}.due.later{color:var(--sub)}
ul.todo li details{flex:1}ul.todo li summary{cursor:pointer;list-style:none}ul.todo li summary::-webkit-details-marker{display:none}
.sublist{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
.kpi.click{cursor:pointer;text-align:left;font:inherit;width:100%}
.kpi.click:hover{border-color:var(--brand)}
.kbar{display:block;height:6px;border-radius:999px;background:var(--surface-muted);margin-top:10px;overflow:hidden}
.kbar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.agenda{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.agenda .day{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start}
.agenda .date{font-size:12px;color:var(--sub);line-height:1.3}.agenda .date b{display:block;font-size:20px;color:var(--brand);font-weight:600}
.agenda .evs{display:flex;flex-direction:column;gap:6px}
.ev{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:var(--surface-muted);font-size:13px}
.ev .dot{width:8px;height:8px;border-radius:50%;flex:none}
.d-in{background:var(--ok)}.d-out{background:var(--bad)}.d-pay{background:#2563eb}.d-fin{background:var(--accent)}.d-ll{background:#7c3aed}
.prog{display:flex;flex-direction:column;gap:16px}
.prog .row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.prog .track{height:10px;border-radius:999px;background:var(--surface-muted);overflow:hidden;margin-top:6px}
.prog .track i{display:block;height:100%;border-radius:999px}
.chart{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:10px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .stack{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden;background:var(--surface-muted)}
.chart .stack i{display:block;width:100%}
.chart .lab{font-size:11px;color:var(--sub)}.chart .val{font-size:11px;font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:10px}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.lcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.lcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.lcard h3{margin:0;font-size:16px;font-weight:600}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lgrid div{background:var(--surface-muted);border-radius:8px;padding:8px 10px}.lgrid .l{font-size:11px;color:var(--sub)}.lgrid .v{font-size:15px;font-weight:600}

/* ===== v0.4 layout: one level of containers, rows instead of tiles, quiet status ===== */
:root{ --bg:#f6f6f8; --line:#ececf0; --muted-fill:#f3f3f6; --brand-line:#c7cbf5; }
main{gap:32px;padding-top:32px}
#view{gap:32px !important}
h1{font-size:26px;letter-spacing:-.01em}
h2{font-size:16px;margin:0}
.sub{margin:4px 0 20px;line-height:1.5}
.top .sub{font-size:13px}
.panel{border-color:var(--line);padding:24px}
.r,td.r,th.r,.kpi .v,.money .v,.lgrid .v{font-variant-numeric:tabular-nums}
/* Status: small tinted labels, one loud colour only for urgent */
.pill{border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;line-height:1.6;display:inline-block}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-fin{background:var(--muted-fill);color:var(--sub)}
.p-plan{background:#eef0fd;color:var(--brand)}
.p-week{background:var(--warn-bg);color:var(--warn)}
.p-urgent{background:var(--bad);color:#fff}
/* KPIs */
.kpis{gap:16px}
.kpi{border-color:var(--line);padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;min-height:118px}
.kpi .v{font-size:28px}
.kpi.click:hover{border-color:var(--brand-line)}
/* Lists become rows with hairlines instead of grey boxes */
ul.todo{gap:0}
ul.todo li{background:none;border-radius:0;padding:12px 4px 12px 14px;border-bottom:1px solid var(--line);box-shadow:inset 3px 0 0 transparent}
ul.todo li:last-child{border-bottom:0}
ul.todo li.l0{background:none;box-shadow:inset 3px 0 0 var(--bad)}
ul.todo li.l1{background:none;box-shadow:inset 3px 0 0 #eab308}
.ev{background:none;border-radius:0;padding:6px 0;border-bottom:1px solid var(--line)}
.agenda .evs .ev:last-child{border-bottom:0}
.agenda .day{padding-bottom:12px;border-bottom:1px solid var(--line)}
.agenda .day:last-child{border-bottom:0}
.agenda .evs{gap:0}
/* Pipeline columns: light frame, white cards */
.col{background:none;border:1px solid var(--line);border-radius:10px}
.card{border-color:var(--line)}
/* Stage: a thin progress line, not a row of boxes */
.steps{gap:4px}
.steps li{background:none;border-radius:0;border-top:3px solid var(--line);padding:8px 2px 0;color:var(--sub)}
.steps li.done{background:none;border-top-color:var(--brand-line);color:var(--sub)}
.steps li.cur{background:none;border-top-color:var(--brand);color:var(--brand);font-weight:600}
/* Checks: grouped rows */
.checks{gap:0}
.checks li{background:none;border-radius:0;padding:11px 0;border-bottom:1px solid var(--line)}
.checks li:last-child{border-bottom:0}
.checks li.on{background:none}
.checks .st{font-weight:500;font-size:12px}
.cgroup{margin:16px 0 2px;font-size:12px;font-weight:600;color:var(--sub)}
.cgroup:first-of-type{margin-top:0}
/* Money: 2 x 2 figures split by hairlines */
.money{gap:0;border-top:1px solid var(--line)}
.money div{background:none;border-radius:0;padding:14px 0;border-bottom:1px solid var(--line)}
.money div:nth-child(odd){padding-right:16px;border-right:1px solid var(--line)}
.money div:nth-child(even){padding-left:16px}
.money .v{font-size:20px}
.box{border:0;border-radius:0;padding:14px 0 0;margin-top:0}
/* Landlord cards */
.lcards{gap:16px}
.lcard{border-color:var(--line);padding:22px;gap:14px}
.lgrid{gap:0;border-top:1px solid var(--line)}
.lgrid div{background:none;border-radius:0;padding:10px 0;border-bottom:1px solid var(--line)}
.lgrid div:nth-child(odd){padding-right:14px;border-right:1px solid var(--line)}
.lgrid div:nth-child(even){padding-left:14px}
/* Tables */
th{padding:10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-top:0;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
/* Controls */
.btn,.sel{height:40px}
.links li{padding-bottom:8px;border-bottom:1px solid var(--line)}
.links li:last-child{border-bottom:0}
.pill.cat{min-width:84px;text-align:center}
.cols{grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:10px}
.next{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;padding:16px 18px;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:10px;background:#fbfbfe}
.next .nlabel{margin:0;font-size:12px;color:var(--sub)}.next .ntitle{margin:2px 0 0;font-size:16px;font-weight:600;color:var(--brand)}.next .ntext{margin:4px 0 0;font-size:14px}
.nwarn{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--bad)}.nwarn li::before{content:"! ";font-weight:700}
.nacts{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:240px}.nacts .btn{justify-content:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 28px;margin-top:16px}
.pgrid dl{margin:0}.pgrid h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--sub)}
.pgrid dl div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.pgrid dt{color:var(--sub)}.pgrid dd{margin:0;text-align:right;font-weight:500}
@media (max-width:760px){.next{grid-template-columns:1fr}.nacts{min-width:0}}
.dq{display:flex;flex-direction:column;gap:14px}
.dqg{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.dqh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--line)}
.dqg ul{list-style:none;margin:0;padding:0}
.dqg li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.dqg li:last-child{border-bottom:0}.dqg li .t{flex:1}.dqg .pill{width:136px;flex:none;text-align:center}
.person{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.person .role,.follow .role{margin:0;font-size:12px;font-weight:600;color:var(--sub)}
.person .pname{margin:2px 0 0;font-size:15px;font-weight:600}
.contact{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.follow{margin-top:14px}.follow .role{margin-bottom:6px}
/* ===== v0.5 "calm" layer: one ink colour, one brand colour, colour only as small dots, one line style ===== */
:root{ --ink:#1c1c28; --sub:#6e6e80; --line:#e8e8ee; --bg:#f7f7f9; --soft:#fafafc; --track:#efeff4; --alert:#c0392b; --good:#2e7d32; --amber:#c9971c; }
body{color:var(--ink);background:var(--bg)}
main{max-width:1240px}
h1{font-size:24px;font-weight:600;color:var(--ink)}
h2{font-size:15px;font-weight:600;color:var(--ink)}
.sub,.minor{color:var(--sub)}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
.linkbtn{text-decoration:none;font-weight:500;font-size:13px} .linkbtn:hover{text-decoration:underline}
/* Surfaces: one card style, no inner boxes */
.panel,.kpi,.lcard{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:none}
.panel{padding:24px}
/* Buttons: quiet secondary, navy primary */
.btn,.sel{height:36px;border:1px solid var(--line);border-radius:10px;font-size:13px;background:#fff;color:var(--ink)}
.btn:hover{border-color:#cfcfda}
.btn.primary,.btn.navy{background:var(--brand);border-color:var(--brand);color:#fff}
/* Status labels: neutral outline; colour only in a 6 px dot */
.pill{background:transparent !important;color:var(--sub) !important;border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-weight:500;font-size:12px}
.pill.p-ok,.pill.p-bad,.pill.p-urgent,.pill.p-rev,.pill.p-week{color:var(--ink) !important}
.pill.p-ok::before,.pill.p-bad::before,.pill.p-urgent::before,.pill.p-rev::before,.pill.p-week::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pill.p-ok::before{background:var(--good)} .pill.p-bad::before,.pill.p-urgent::before{background:var(--alert)} .pill.p-rev::before,.pill.p-week::before{background:var(--amber)}
/* KPIs: same anatomy in every card, numbers in ink */
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{padding:18px 20px;min-height:132px;gap:4px}
.kpi .l{font-size:12px;color:var(--sub)}
.kpi .v{font-size:26px;font-weight:600;color:var(--ink) !important;margin-top:auto}
.kpi .n{font-size:12px;color:var(--sub) !important;min-height:32px}
.kpi .n[style*="--bad"]::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--alert);margin-right:6px;vertical-align:1px}
.kbar{height:3px;background:var(--track);margin-top:8px} .kbar i{background:var(--brand) !important}
/* Filters as quiet tabs on one line */
.filters{gap:0;flex-wrap:nowrap;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 4px}
.fchip{border:0;border-radius:0;background:none;padding:8px 10px;color:var(--sub);font-size:13px;border-bottom:2px solid transparent;white-space:nowrap}
.fchip[aria-pressed="true"]{background:none;color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.fsep{display:none}
/* Today: rows only, no coloured bars */
ul.todo li,ul.todo li.l0,ul.todo li.l1{box-shadow:none !important;padding:14px 0;gap:14px}
.pill.cat{border:0;padding:0;width:78px;flex:none;text-align:left;font-size:12px;color:var(--sub) !important}
.due{font-weight:500;font-size:12px} .due.over{color:var(--alert)} .due.soon,.due.later{color:var(--sub)}
/* Agenda: dates in ink, one neutral dot, no colour legend */
.agenda .date b{color:var(--ink);font-weight:600}
.ev{font-size:13px} .ev .dot{background:#c9c9d6 !important;width:6px;height:6px}
.agenda + .legend{display:none}

<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fb6e44" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M10 21v-6h4v6"></path></svg>
      <span>Rental Management</span><span class="tag">PMS</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" aria-selected="true" data-view="overview">Overview</button>
      <button role="tab" aria-selected="false" data-view="tenancies">Tenancies</button>
      <button role="tab" aria-selected="false" data-view="landlords">Landlords</button>
      <button role="tab" aria-selected="false" data-view="properties">Properties</button>
      <button role="tab" aria-selected="false" data-view="finance">Finance</button>
    </nav>
    <div class="hright">
      <label class="t"><input type="checkbox" id="showTest"> Show test records</label>
      <label for="q" class="vh">Search tenancy, booking or landlord</label>
      <input id="q" type="search" placeholder="Search tenancy, booking or landlord">
    </div>
  </div>
</header>
<main>
  <div class="err" id="err" role="alert"></div>
  <div id="view" style="display:flex;flex-direction:column;gap:24px"><p class="empty">Loading data from Zoho CRM…</p></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===== Config ===== */
const ORG = "org34644249";
const TEN_TAB = "CustomModule90";
const FEE_TAB = "CustomModule91";
const CASE_TAB = "CustomModule80";
const SYNC_FUNCTION = "rm_sync_payments_now";
const AUTO_REFRESH_MIN = 5;
const STAGES = ["Confirmed","Contract sent","Contract signed","Ready for move-in","Active","Ending","Moved out","Closed","Cancelled"];
const GATE_STAGES = ["Ready for move-in","Active"];
const FINANCE_TYPES = ["Monthly","Monthly (months 1 + 2)","Extension first half"];
const TEN_FIELDS = "Name, Owner, Stage, Source, Contract_Type, Landlord, Landlord.Account_Name, Booking, Booking_Reference, Tenant_Profile, Tenant_Profile.Name, Move_in_Date, Planned_Move_out_Date, Actual_Move_out_Date, Monthly_Rent, Deposit, Contract_Signed, Deposit_Received, First_Rent_Paid, Inventory_Reviewed, Move_in_Instructions_Sent, Meter_Readings_Recorded, Condition_Document_Signed, Deposit_Settled, Key_Gate_Ready, Vetting_Status, Cause_Document_Received, RM_Property, Rent_Collected, Rent_Pending, Unpaid_Installments, Arrears_Alert, Paid_to_Landlord, Next_Payout_Date, Fees_Planned, Fees_Applied, Fees_Invoiced, Payments_Last_Sync, Tenancy_Folder_Link, Upfront_Fee, Monthly_Fee, Rentable_Unit_ID, Listing_ID, Landlord_Platform_ID";
const FEE_FIELDS = "Name, Tenancy, Tenancy.Name, Landlord, Landlord.Account_Name, Service_Month, Fee_Type, Base_Amount, Fee_Amount, VAT, Total, Status, Check_Result, Deducted_Amount, Payin_Amount, Payout_Amount, Sent_to_Finance_On, Invoice_Number, Fee_Charged_Payments, Fee_Refunded_Payments, Payments_Checked_On";

/* ===== State ===== */
let S = { stmt:null, stmtBusy:false, overdue:{}, allInst:[], accounts:{}, me:null, filt:{ type:"all", scope:"all" }, view:"overview", tenancies:[], fees:[], detail:null, inst:[], landlordFolder:null, deal:null, acc:null, tasks:[], cases:[], loadedAt:null };

/* ===== Helpers ===== */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = v => (v === null || v === undefined || v === "") ? "—" : new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(Number(v));
const d = v => v ? new Date(v + (String(v).length === 10 ? "T00:00:00" : "")) : null;
const fmt = v => { const x = d(v); return x ? x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}) : "—"; };
const today = () => { const t = new Date(); t.setHours(0,0,0,0); return t; };
const days = v => { const x = d(v); return x ? Math.round((x - today()) / 86400000) : null; };
const iso = x => x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0");
const monthStart = (offset) => { const t = today(); return new Date(t.getFullYear(), t.getMonth() + offset, 1); };
const nameOf = l => l ? (l.name || "") : "";
/* Key gate = contract + deposit + first rent + vetting Accepted (tenancies without a booking, e.g. own tenant, do not need vetting) */
const vettingOk = t => !t.Booking || t.Vetting_Status === "Accepted";
const gateOk = t => t.Contract_Signed === true && t.Deposit_Received === true && t.First_Rent_Paid === true && vettingOk(t);
/* Contract templates (Google Docs, pending Legal review) and tools used from the tenancy page */
const CONTRACT_TPL = {
  "Temporary housing": "https://docs.google.com/document/d/13FimXalMQlRVNpJU73dt8vVWywtb_4M7RHPm_PCsSAE",
  "Room": "https://docs.google.com/document/d/1pbCzcCuVk_rMSMAUujsMNC5hIlYKphQS28ZoHQL1kv8",
  "Habitual housing": "https://docs.google.com/document/d/1WklzhXuWyyh_XksulyfD-XXItSoU2Xijqsyf-TJPtLE"
};
const INVENTORY_APP = "https://rm-property-inventory.internal-apps.k8s.infra.spotahome.net/";
const mailto = (to, subject, body) => "mailto:" + encodeURIComponent(to || "") + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
/* Key gate deadline: 2 working days before move-in (same rule as rm_daily_stages_and_tasks) */
const workDaysBefore = (isoDate, n) => { if (!isoDate) return null; const d = new Date(isoDate + "T00:00:00"); let c = 0; while (c < n) { d.setDate(d.getDate() - 1); const w = d.getDay(); if (w !== 0 && w !== 6) c++; } return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const isTest = t => /test/i.test(nameOf(t.Landlord));
const recUrl = (tab,id) => "https://crm.zoho.com/crm/" + ORG + "/tab/" + tab + "/" + id;
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display="none",3500); }
function showErr(msg){ const el=$("#err"); el.textContent=msg; el.style.display = msg ? "block" : "none"; }

async function coql(query){
  const r = await ZOHO.CRM.API.coql({ select_query: query });
  if (r && r.data) return r;
  return { data: [], info: { more_records: false } };
}
async function coqlAll(base){
  let out = [], offset = 0;
  for (let i = 0; i < 10; i++) {
    const r = await coql(base + " limit " + offset + ", 200");
    out = out.concat(r.data);
    if (!r.info || !r.info.more_records) break;
    offset += 200;
  }
  return out;
}
async function update(entity, data){
  const r = await ZOHO.CRM.API.updateRecord({ Entity: entity, APIData: data, Trigger: [] });
  const ok = r && r.data && r.data[0] && r.data[0].code === "SUCCESS";
  if (!ok) throw new Error((r && r.data && r.data[0] && r.data[0].message) || "Zoho did not save the change");
  return r;
}

/* ===== Load ===== */
async function load(){
  if (!window.__preview) showErr("");
  try {
    const [ten, fees] = await Promise.all([
      coqlAll("select " + TEN_FIELDS + " from RM_Tenancies where id is not null order by Move_in_Date asc"),
      coqlAll("select " + FEE_FIELDS + " from RM_Fee_Lines where id is not null order by Service_Month asc")
    ]);
    try { S.props = await coqlAll("select Name, Listing_ID, Rentable_Unit_IDs, Landlord, Landlord.Account_Name, Preferences_Submitted_On, Insurance_24h_Phone, Property_Name, SG_Next_Available, SG_Availability, SG_Availability_Updated, Inventory_Upload_Link, Inventory_Received_On, Inventory_Files, Listing, Listing.Listing_Published from RM_Properties where id is not null"); S.props.forEach(p => { if (p.Landlord && p["Landlord.Account_Name"]) p.Landlord.name = p["Landlord.Account_Name"]; });
      // Only properties we really manage: linked to a landlord and with the listing published in Stargate (archived or unpublished listings are hidden)
      S.props = S.props.filter(p => p.Landlord && p.Listing && p["Listing.Listing_Published"] === true); } catch(e) { S.props = []; }
    // COQL returns lookups as {id} only: copy the names selected with dot notation into them
    for (const t of ten) {
      if (t.Landlord) t.Landlord.name = t["Landlord.Account_Name"] || "";
      if (t.Tenant_Profile) t.Tenant_Profile.name = t["Tenant_Profile.Name"] || "";
    }
    for (const f of fees) {
      if (f.Tenancy) f.Tenancy.name = f["Tenancy.Name"] || "";
      if (f.Landlord) f.Landlord.name = f["Landlord.Account_Name"] || "";
    }
    // Installments of all RM bookings due this month and in the next 31 days (collections and agenda)
    const bIds = [...new Set(ten.map(t => t.Booking && t.Booking.id).filter(Boolean))];
    const from = iso(monthStart(0)), to = iso(new Date(today().getTime() + 31 * 86400000));
    let inst = [];
    for (let i = 0; i < bIds.length; i += 40) {
      const ids = bIds.slice(i, i + 40).map(x => "'" + x + "'").join(",");
      inst = inst.concat(await coqlAll("select Booking, Installment_Type, Installment_Status, Expected_Amount, Paid_Amount, Installment_Due_Date, Period_From from Installments where Booking in (" + ids + ") and Installment_Due_Date between '" + from + "' and '" + to + "' order by Installment_Due_Date asc"));
    }
    // Landlord details (VAT number and phone) for data quality and the Landlords tab
    const lIds = [...new Set(ten.map(t => t.Landlord && t.Landlord.id).filter(Boolean))];
    const accs = {};
    // Every Rental Management landlord (manual flag or RM plan from Stargate), with or without tenancies
    let rmAccs = [];
    try { rmAccs = await coqlAll("select Account_Name, CIF, Phone, Email, RM_Folder_Map, RM_Folder_Link, Last_Statement_Date, Subscription_type, Rental_Management from Accounts where (Rental_Management = true or Subscription_type = 'rentalManagement')"); } catch(e) { rmAccs = []; }
    rmAccs.forEach(a => { accs[a.id] = a; });
    S.rmLandlords = rmAccs.map(a => ({ id: a.id, name: a.Account_Name || "" }));
    for (const lid of [...lIds]) { if (accs[lid]) lIds.splice(lIds.indexOf(lid), 1); }
    for (let i = 0; i < lIds.length; i += 40) {
      const ids = lIds.slice(i, i + 40).map(x => "'" + x + "'").join(",");
      (await coql("select Account_Name, CIF, Phone, Email, RM_Folder_Map, Last_Statement_Date from Accounts where id in (" + ids + ") limit 200")).data.forEach(a => accs[a.id] = a);
    }
    if (!S.me && ZOHO.CRM.CONFIG && ZOHO.CRM.CONFIG.getCurrentUser) {
      try { const u = await ZOHO.CRM.CONFIG.getCurrentUser(); S.me = u && u.users && u.users[0] ? u.users[0].id : null; } catch(e) {}
    }
    // Overdue rent: payins already due and not fully paid, read live from Installments
    const od = {}, todayIso = iso(today());
    for (let i = 0; i < bIds.length; i += 40) {
      const ids = bIds.slice(i, i + 40).map(x => "'" + x + "'").join(",");
      (await coqlAll("select Booking, Expected_Amount, Paid_Amount, Installment_Due_Date, Installment_Status from Installments where ((Booking in (" + ids + ") and Installment_Type = 'payin') and (Installment_Status in ('unpaid','pending','partially_paid') and Installment_Due_Date < '" + todayIso + "'))")).forEach(r => {
        const left = Number(r.Expected_Amount || 0) - Number(r.Paid_Amount || 0);
        if (!r.Booking || left <= 0) return;
        const o = od[r.Booking.id] = od[r.Booking.id] || { amount:0, count:0, oldest:r.Installment_Due_Date };
        o.amount += left; o.count += 1; if (r.Installment_Due_Date < o.oldest) o.oldest = r.Installment_Due_Date;
      });
    }
    S.overdue = od;
    S.allInst = inst; S.accounts = accs; S.stmt = null;
    S.tenancies = ten; S.fees = fees; S.loadedAt = new Date();
    if (S.detail) { const fresh = ten.find(x => x.id === S.detail.id); if (fresh) { S.detail = fresh; } }
    render();
  } catch(e) {
    showErr("Could not read Zoho CRM: " + (e.message || e) + ". Check you have access to RM Tenancies and RM Fee Lines.");
  }
}

function visibleTenancies(){
  const q = $("#q").value.trim().toLowerCase();
  const showTest = $("#showTest").checked;
  return S.tenancies.filter(t => (showTest || !isTest(t)) && (!q || [t.Name, t.Booking_Reference, nameOf(t.Landlord), nameOf(t.Tenant_Profile)].join(" ").toLowerCase().includes(q)));
}
function visibleFees(){
  const ids = new Set(visibleTenancies().map(t => t.id));
  return S.fees.filter(f => f.Tenancy && ids.has(f.Tenancy.id));
}

/* ===== Today rules ===== */
function render(){
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.view === S.view && !S.detail)));
  if (S.detail) return renderDetail();
  if (S.view === "overview") return renderOverview();
  if (S.view === "tenancies") return renderTenancies();
  if (S.view === "landlords") return renderLandlords();
  if (S.view === "properties") return renderProperties();
  if (S.view === "finance") return renderFinance();
}
const overdueOf = t => t && t.Booking ? S.overdue[t.Booking.id] || null : null;
function dueLabel(n){
  if (n === null || n === undefined) return { txt:"to review", cls:"later" };
  if (n < 0) return { txt:"overdue " + (-n) + " d", cls:"over" };
  if (n === 0) return { txt:"today", cls:"over" };
  if (n === 1) return { txt:"tomorrow", cls:"soon" };
  return { txt:"in " + n + " days", cls: n <= 7 ? "soon" : "later" };
}
const CAT = { keys:"Keys", payments:"Payments", stay:"Stay", extensions:"Extensions", deposits:"Deposits", data:"Data", finance:"Finance" };
function todayItems(){
  const items = [];
  for (const t of visibleTenancies()) {
    const toIn = days(t.Move_in_Date), toOut = days(t.Planned_Move_out_Date), sinceOut = days(t.Actual_Move_out_Date);
    if (["Confirmed","Contract sent","Contract signed","Ready for move-in"].includes(t.Stage) && toIn !== null && toIn <= 7 && !gateOk(t)) {
      const miss = [!t.Contract_Signed && "contract", !t.Deposit_Received && "deposit", !t.First_Rent_Paid && "first rent", !vettingOk(t) && "vetting"].filter(Boolean).join(", ");
      items.push({ cat:"keys", due:days(workDaysBefore(t.Move_in_Date, 2)), t, text:"Key gate · move-in " + fmt(t.Move_in_Date) + " · missing " + miss });
    }
    if (["Confirmed","Contract sent","Contract signed","Ready for move-in"].includes(t.Stage) && toIn !== null && toIn >= 0 && toIn <= 3 && !t.Move_in_Instructions_Sent) items.push({ cat:"keys", due:toIn - 1, t, text:"Send move-in instructions · move-in " + fmt(t.Move_in_Date) });
    if (["Confirmed","Contract sent","Contract signed","Ready for move-in"].includes(t.Stage) && t.Vetting_Status === "Declined") items.push({ cat:"keys", due:0, t, text:"Vetting declined · review the booking before sending the contract" });
    const od = overdueOf(t);
    if (od) items.push({ cat:"payments", due:days(od.oldest), t, text:"Overdue rent " + eur(od.amount) + " (" + od.count + " payment" + (od.count > 1 ? "s" : "") + ", since " + fmt(od.oldest) + ") · start recovery, check the guarantee" });
    if (t.Stage === "Active" && !t.Inventory_Reviewed && toIn !== null && toIn <= 0 && toIn >= -3) items.push({ cat:"stay", due:toIn + 1, t, text:"Inventory review (24 h after move-in)" });

    if (["Active","Ending"].includes(t.Stage) && toOut !== null && toOut >= 0 && toOut <= 60) items.push({ cat:"extensions", due:toOut - 45, t, text:"Extension decision · move-out " + fmt(t.Planned_Move_out_Date) });
    if (t.Stage === "Moved out" && sinceOut !== null && (!t.Meter_Readings_Recorded || !t.Condition_Document_Signed)) items.push({ cat:"deposits", due:sinceOut + 3, t, text:"Meter readings and condition document · moved out " + fmt(t.Actual_Move_out_Date) });
    if (t.Stage === "Moved out" && !t.Deposit_Settled && sinceOut !== null) items.push({ cat:"deposits", due:sinceOut + 30, t, text:"Deposit to return · moved out " + fmt(t.Actual_Move_out_Date) });
  }
  const byTen = {};
  for (const f of visibleFees()) if (f.Check_Result === "Review" && f.Status !== "Cancelled" && f.Tenancy) (byTen[f.Tenancy.id] = byTen[f.Tenancy.id] || []).push(f);
  for (const id in byTen) {
    const t = S.tenancies.find(x => x.id === id); if (!t) continue;
    const list = byTen[id].sort((a,b) => String(a.Service_Month).localeCompare(String(b.Service_Month)));
    items.push({ cat:"finance", due:null, t, text: list.length + " deduction(s) do not match the fee", sub: list.map(f => fmt(f.Service_Month) + " · fee " + eur(f.Fee_Amount) + " · deducted " + eur(f.Deducted_Amount)) });
  }

  const dl25 = (() => { const x = new Date(); x.setHours(0,0,0,0); const t25 = new Date(x.getFullYear(), x.getMonth() + (x.getDate() > 25 ? 1 : 0), 25); return Math.round((t25 - x) / 86400000); })();

  if (dom >= 20 && dom <= 25 && pend) items.push({ cat:"finance", due:25 - dom, t:null, text: pend + " fee line(s) for next month to send to Finance" });
  const rank = i => i.due === null ? 9999 : i.due;
  return items.sort((a,b) => rank(a) - rank(b));

/* Data gaps of one tenancy: 1 blocks money (payments, fees, invoicing), 2 blocks the service, 3 incomplete record */
function gapsOf(t){
  const props = S.props || [];
  const out = [], a = t.Landlord ? S.accounts[t.Landlord.id] : null;
  const p = props.find(x => (t.RM_Property && x.id === t.RM_Property.id) || (t.Listing_ID && String(x.Listing_ID) === String(t.Listing_ID)));
  if (["Cancelled","Closed"].includes(t.Stage)) return out;
  if (!t.Booking && t.Source !== "Own tenant") out.push({ lvl:1, txt:"No booking linked: payments, fee checks and statements cannot work", fix:"Fill in Booking on the tenancy" });
  if (!Number(t.Monthly_Rent)) out.push({ lvl:1, txt:"Monthly rent missing: fees cannot be calculated", fix:"Fill in Monthly Rent" });
  if (a && !a.CIF) out.push({ lvl:1, txt:"Landlord without VAT number: Finance cannot invoice the fee", fix:"Fill in the VAT number on the landlord", acc:a });
  if (a && a.CIF && /^[A-Z]{2}/i.test(String(a.CIF).trim()) && !/^ES/i.test(String(a.CIF).trim())) out.push({ lvl:1, txt:"Foreign VAT number (" + String(a.CIF).trim().slice(0,2).toUpperCase() + "): the fee is calculated with 21% Spanish VAT", fix:"Check the VAT treatment with Finance before sending the list", acc:a });
  if (!t.Move_in_Date || !t.Planned_Move_out_Date) out.push({ lvl:2, txt:"Move-in or move-out date missing: stages and tasks cannot run", fix:"Fill in both dates" });
  if (!t.Contract_Type) out.push({ lvl:2, txt:"Contract type missing: the right contract template cannot be chosen", fix:"Fill in Contract Type" });
  if (t.Contract_Type === "Temporary housing" && !t.Cause_Document_Received && t.Stage !== "Moved out") out.push({ lvl:2, txt:"Temporary contract without the cause document (legal risk)", fix:"Get the document and tick Cause Document Received" });
  if (!p) out.push({ lvl:2, txt:"No RM Property: rules, keys and insurance are unknown", fix:"Link the tenancy to its RM Property" });
  else if (!p.Inventory_Received_On && ["Confirmed","Contract sent","Contract signed","Ready for move-in"].includes(t.Stage) && days(t.Move_in_Date) !== null && days(t.Move_in_Date) <= 30)
    out.push({ lvl:2, txt:"No inventory received for the property and the move-in is on " + fmt(t.Move_in_Date) + ": the deposit is not protected", fix:"Send the landlord the inventory app and upload link from the property page", prop:p });
  else if (!p.Preferences_Submitted_On) out.push({ lvl:2, txt:"The landlord has not sent the property preferences", fix:"Send the form from the tenancy page" });
  else if (!p.Insurance_24h_Phone) out.push({ lvl:3, txt:"No insurance 24 h phone for emergencies", fix:"Ask the landlord and fill it in on the RM Property", prop:p });
  if (!t.Tenant_Profile) out.push({ lvl:3, txt:"No tenant linked: name and history are missing", fix:"Fill in Tenant Profile" });
  return out.sort((x,y) => x.lvl - y.lvl);
}

/* ===== Landlord statements (last 3 months, live from Installments and RM Fee Lines) ===== */
/* Statement rule (same as rm_generate_statement): our fee only appears when it was really deducted.
   Fee with VAT = checked with the payments database (Fee Charged − Refunded) or, if not checked yet, the planned fee when the payout matches it.
   Other adjustments = rent − paid − fee − VAT, so every row reconciles. */
function stmtLine(rent, paid, plan, planVat, checkedNet){
  const ded = rent - paid, planned = plan + planVat;
  let feeVat = 0, how = "";
  if (paid <= 0) return { fee:0, vat:0, other:0, state:"pending", note:"Payout not paid yet" };
  if (checkedNet !== null) { feeVat = checkedNet; how = "checked with payments"; }
  else if (planned > 0 && Math.abs(ded - planned) <= 1) { feeVat = planned; how = "matches the planned fee"; }
  const fee = feeVat === planned ? plan : Math.round(feeVat / 1.21 * 100) / 100, vat = Math.round((feeVat - fee) * 100) / 100;
  const other = Math.round((ded - feeVat) * 100) / 100;
  if (planned > 0 && feeVat === 0) return { fee:0, vat:0, other, state:"check", note:"Fee not deducted yet (planned " + eur(planned) + ")" };
  if (Math.abs(other) > 1) return { fee, vat, other, state:"check", note:"Other adjustments of " + eur(other) + " to explain" };
  return { fee, vat, other:0, state:"ready", note: how ? "Fee " + how : "No fee this month" };
}
async function loadStatements(){
  if (S.stmtBusy) return; S.stmtBusy = true;
  try {
    const ten = visibleTenancies();
    const byBooking = {}; ten.forEach(t => { if (t.Booking) byBooking[t.Booking.id] = t; });
    const ids = Object.keys(byBooking);
    const from = iso(monthStart(-2)), to = iso(new Date(monthStart(1).getTime() - 86400000));
    let inst = [];
    for (let i = 0; i < ids.length; i += 40) {
      const chunk = ids.slice(i, i + 40).map(x => "'" + x + "'").join(",");
      inst = inst.concat(await coqlAll("select Booking, Installment_Type, Installment_Status, Paid_Amount, Period_From from Installments where Booking in (" + chunk + ") and Period_From between '" + from + "' and '" + to + "'"));
    }
    const per = {};
    const ensureT = (t, m) => { const k = t.id + "|" + m; return per[k] = per[k] || { t, month:m, rent:0, paid:0, plan:0, vat:0, checked:null }; };
    for (const r of inst) {
      const t = r.Booking ? byBooking[r.Booking.id] : null;
      if (!t || !t.Landlord || !["paid","overpaid"].includes(r.Installment_Status)) continue;
      const o = ensureT(t, String(r.Period_From).slice(0,7));
      if (r.Installment_Type === "payin") o.rent += Number(r.Paid_Amount || 0); else if (r.Installment_Type === "payout") o.paid += Number(r.Paid_Amount || 0);
    }
    for (const f of visibleFees()) {
      const t = f.Tenancy ? S.tenancies.find(x => x.id === f.Tenancy.id) : null;
      const m = String(f.Service_Month || "").slice(0,7);
      if (!t || !t.Landlord || f.Status === "Cancelled" || m < from.slice(0,7) || m > to.slice(0,7)) continue;
      const o = ensureT(t, m); o.plan += Number(f.Fee_Amount || 0); o.vat += Number(f.VAT || 0);
      if (f.Payments_Checked_On) o.checked = (o.checked || 0) + Number(f.Fee_Charged_Payments || 0) - Number(f.Fee_Refunded_Payments || 0);
    }
    const out = {};
    for (const o of Object.values(per)) {
      const l = stmtLine(o.rent, o.paid, o.plan, o.vat, o.checked);
      const k = o.t.Landlord.id + "|" + o.month;
      const a = out[k] = out[k] || { landlordId:o.t.Landlord.id, landlord:nameOf(o.t.Landlord), month:o.month, rent:0, paid:0, fee:0, vat:0, other:0, state:"ready", notes:[] };
      a.rent += o.rent; a.paid += o.paid; a.fee += l.fee; a.vat += l.vat; a.other += l.other;
      if (l.state === "check") a.state = "check"; else if (l.state === "pending" && a.state === "ready") a.state = "pending";
      if (l.state !== "ready") a.notes.push(o.t.Name + ": " + l.note);
    }
    S.stmt = Object.values(out).sort((a,b) => b.month.localeCompare(a.month) || a.landlord.localeCompare(b.landlord));
  } catch(e) { S.stmt = []; showErr("Could not load the statements: " + (e.message || e)); }
  S.stmtBusy = false;
  if (S.view === "finance" && !S.detail) render();
}

/* ===== Properties: next available dates from Spotahome bookings (rm_sg_sync_all, daily 07:00) ===== */
/* Reads the text written by rm_sg_sync_property: "=== Unidad X ===", "Proxima reservable: YYYY-MM-DD (minStay N dias)", then "Ocupado:" / "Libre:" lists of "  - A -> B" */
function parseAvail(txt){
  const units = []; let u = null, sec = "";
  String(txt || "").split(/\r?\n/).forEach(line => {
    let m;
    if ((m = line.match(/^=== *(?:Unidad|Unit) *(.+?) *===/i))) { u = { id:m[1], next:null, min:null, occ:[], free:[], error:null }; units.push(u); sec = ""; return; }
    if (!u) return;
    if ((m = line.match(/ERROR: *(.*)/i))) { u.error = m[1]; return; }
    if ((m = line.match(/(?:Proxima reservable|Next bookable): *(\d{4}-\d{2}-\d{2})(?:.*?minStay *(\d+))?/i))) { u.next = m[1]; u.min = m[2] ? Number(m[2]) : null; return; }
    if (/^ *(Ocupado|Booked)/i.test(line)) { sec = "occ"; return; }
    if (/^ *(Libre|Free)/i.test(line)) { sec = "free"; return; }
    if ((m = line.match(/(\d{4}-\d{2}-\d{2}) *(?:->|→) *(\d{4}-\d{2}-\d{2})?(.*)/))) {
      if (sec === "occ") u.occ.push({ a:m[1], b:m[2] || null });
      else if (sec === "free") u.free.push({ a:m[1], b:m[2] || null, ok: !/NO reservable|not bookable/i.test(m[3] || "") });
    }
  });
  return units;
}

  /* Timeline: today → +180 days */
  const H = 180, t0 = (() => { const x = new Date(); x.setHours(0,0,0,0); return x; })(), t1 = new Date(t0.getTime() + H * 86400000);
  const pos = v => { const x = d(v); if (!x) return 100; return Math.max(0, Math.min(100, (x - t0) / (t1 - t0) * 100)); };
  const ticks = []; { const m = new Date(t0.getFullYear(), t0.getMonth() + 1, 1); while (m < t1) { ticks.push({ l: pos(m.toISOString().slice(0,10)), txt: m.toLocaleDateString("en-GB",{month:"short"}) }); m.setMonth(m.getMonth() + 1); } }
  const seg = (a, b, cls, title) => { const l = pos(a), r = b ? pos(b) : 100; return r > l ? `<i class="${cls}" style="left:${l}%;width:${r - l}%" title="${esc(title)}"></i>` : ""; };

async function openDetail(id){
  const t = S.tenancies.find(x => x.id === id);
  if (!t) return;
  const same = S.detail && S.detail.id === id;
  S.detail = t;
  if (!same) { S.inst = []; S.landlordFolder = null; S.deal = null; S.acc = null; S.tasks = []; S.cases = []; S.prop = null; render(); }
  try {
    const jobs = [];
    if (t.Booking) {
      jobs.push(coqlAll("select Installment_Type, Installment_Status, Expected_Amount, Paid_Amount, Period_From, Installment_Due_Date, Failure_Motive, Payment_Method from Installments where Booking = '" + t.Booking.id + "' order by Period_From asc").then(r => S.inst = r));
      jobs.push(ZOHO.CRM.API.getRecord({Entity:"Deals",RecordID:t.Booking.id}).then(r => {
        S.deal = r.data && r.data[0] ? r.data[0] : null;
        /* Keep the tenancy's vetting in step with the booking as soon as someone opens it */
        const v = S.deal && S.deal.Vetting_Status;
        if (v && v !== t.Vetting_Status && !window.__preview) { update("RM_Tenancies", { id: t.id, Vetting_Status: v }).then(() => { t.Vetting_Status = v; if (S.detail === t) render(); }).catch(() => {}); }
      }));
      jobs.push(coql("select Name, Category, Stage, Severity, Created_Time from Case_Management where Booking = '" + t.Booking.id + "' order by Created_Time desc limit 20").then(r => S.cases = r.data));
    }
    if (t.Landlord) {
      jobs.push(ZOHO.CRM.API.getRecord({Entity:"Accounts",RecordID:t.Landlord.id}).then(r => { S.acc = r.data && r.data[0] ? r.data[0] : null; S.landlordFolder = S.acc ? S.acc.RM_Folder_Link : null; }));
    }
    if (t.RM_Property && t.RM_Property.id) jobs.push(ZOHO.CRM.API.getRecord({Entity:"RM_Properties",RecordID:t.RM_Property.id}).then(r => { S.prop = r.data && r.data[0] ? r.data[0] : null; }));
    else if (t.Listing_ID) jobs.push(coql("select id from RM_Properties where Listing_ID = '" + String(t.Listing_ID).replace(/'/g,"") + "' limit 1").then(r => r.data && r.data[0] ? ZOHO.CRM.API.getRecord({Entity:"RM_Properties",RecordID:r.data[0].id}).then(x => { S.prop = x.data && x.data[0] ? x.data[0] : null; }) : null));
    jobs.push(coql("select Subject, Status, Due_Date, Priority from Tasks where What_Id = '" + t.id + "' and Status != 'Completed' order by Due_Date asc limit 20").then(r => S.tasks = r.data).catch(() => S.tasks = []));
    await Promise.all(jobs.map(j => j.catch(e => console.warn(e))));
  } catch(e) { showErr("Could not read the tenancy details: " + (e.message || e)); }
  if (S.detail && S.detail.id === id) render();
}

/* ===== Next step: what to do now for this tenancy, with one-click actions ===== */
function nextStep(t, dl, ac, p){
  const W = [], A = [];
  const addr = dl.Address || "the property", tenantMail = dl.Email || "", llMail = ac.Email || "";
  const toIn = days(t.Move_in_Date), toOut = days(t.Planned_Move_out_Date);
  const prefsMissing = !p || !p.Preferences_Submitted_On;
  const formLink = p && p.Preferences_Form_Link;
  const temp = t.Contract_Type === "Temporary housing";
  const plusDays = (v, n) => { const x = d(v); return x ? new Date(x.getTime() + n * 86400000) : null; };
  // Detections, whatever the stage
  if (temp && !t.Cause_Document_Received && !["Moved out","Closed","Cancelled"].includes(t.Stage)) W.push("Temporary contract without the cause document: without it the contract can be treated as habitual housing.");
  if (["Confirmed","Contract sent"].includes(t.Stage) && t.Contract_Signed) W.push("The contract is ticked as signed but the stage is still " + t.Stage + ". It moves on its own tomorrow at 07:15, or change it now.");
  if (["Ready for move-in","Active"].includes(t.Stage) && !gateOk(t)) W.push("Stage " + t.Stage + " without the full key gate (contract, deposit, first rent and vetting).");
  if (["Active","Ending"].includes(t.Stage) && toOut !== null && toOut < 0) W.push("The planned move-out (" + fmt(t.Planned_Move_out_Date) + ") has passed.");
  if (prefsMissing && !["Closed","Cancelled"].includes(t.Stage)) W.push("The landlord has not sent the property preferences yet (rules, keys, insurance).");
  if (t.Vetting_Status === "Declined") W.push("Vetting declined: do not send the contract or hand over the keys.");
  // Step by stage
  let title = "", text = "";
  const missGate = [!t.Contract_Signed && "contract", !t.Deposit_Received && "deposit", !t.First_Rent_Paid && "first rent", !vettingOk(t) && "vetting"].filter(Boolean);
  switch (t.Stage) {
    case "Confirmed":
      if (t.Booking && t.Vetting_Status !== "Accepted") { title = "Wait for the vetting"; text = "Vetting is " + (t.Vetting_Status || "pending").toLowerCase() + ". Send the contract once it is accepted."; }
      else { title = "Prepare and send the contract"; text = "Fill in the " + (t.Contract_Type || "right") + " template, send it for signature and change the stage to Contract sent."; if (CONTRACT_TPL[t.Contract_Type]) A.push({ label:"Open the contract template", href:CONTRACT_TPL[t.Contract_Type] }); }
      break;
    case "Contract sent":
      title = "Waiting for the signature"; text = "Tick Contract signed when it arrives.";
      if (tenantMail) A.push({ label:"Remind the tenant", href: mailto(tenantMail, "Your rental contract for " + addr, "Hi,\n\nThis is a reminder to sign your rental contract for " + addr + " (move-in " + fmt(t.Move_in_Date) + "). Once it is signed we can confirm the move-in details.\n\nThanks,\nSpotahome Rental Management") });
      break;
    case "Contract signed":
      title = "Complete the key gate";
      text = missGate.length ? "Missing: " + missGate.join(", ") + ". The deposit must be in the landlord's account 2 working days before move-in (" + fmt(workDaysBefore(t.Move_in_Date, 2)) + ")." : "Everything is in place; the stage moves to Ready for move-in tomorrow at 07:15.";
      if (!t.Deposit_Received && llMail) A.push({ label:"Ask the landlord to confirm the deposit", href: mailto(llMail, "Fianza recibida · " + addr, "Hola,\n\n¿Nos confirmas que has recibido la fianza" + (t.Deposit ? " de " + eur(t.Deposit) : "") + " del inquilino de " + addr + "? La entrada es el " + fmt(t.Move_in_Date) + " y necesitamos la confirmación antes del " + fmt(workDaysBefore(t.Move_in_Date, 2)) + ".\n\nGracias,\nSpotahome Rental Management") });
      break;
    case "Ready for move-in":
      if (!t.Move_in_Instructions_Sent) {
        title = "Send the move-in instructions"; text = "Send them before " + fmt(t.Move_in_Date) + " and tick Move-in instructions sent.";
        if (tenantMail) A.push({ label:"Email the move-in instructions", href: mailto(tenantMail, "Your move-in at " + addr, "Hi,\n\nYour move-in is on " + fmt(t.Move_in_Date) + " at " + addr + ".\n\n" + (p && p.Check_in_Hours ? "Check-in hours: " + p.Check_in_Hours + "\n" : "") + (p && p.Key_Handover ? "Keys: " + p.Key_Handover + "\n" : "") + "\nPlease check the inventory when you arrive and tell us within 24 hours if anything is missing or damaged.\n\nThanks,\nSpotahome Rental Management") });
      } else { title = "Ready for the move-in"; text = "On " + fmt(t.Move_in_Date) + " the stage moves to Active. Use the inventory app at the check-in."; }
      A.push({ label:"Open the inventory app", href:INVENTORY_APP });
      break;
    case "Active":
      if (!t.Inventory_Reviewed && toIn !== null && toIn <= 0 && toIn >= -3) { title = "Review the inventory"; text = "Within 24 hours of the move-in, then tick Inventory reviewed."; A.push({ label:"Open the inventory app", href:INVENTORY_APP }); }
      else if (toOut !== null && toOut < 0) { title = "Confirm the move-out"; text = "Fill in Actual Move-out Date in the CRM and change the stage to Moved out, or update the planned date if it was extended."; }
      else { title = "Tenancy running"; text = toOut !== null ? "Next: extension decision from " + fmt(plusDays(t.Planned_Move_out_Date, -60)) + "." : "Nothing pending."; }
      break;
    case "Ending":
      if (toOut !== null && toOut < 0) { title = "Confirm the move-out"; text = "Fill in Actual Move-out Date in the CRM and change the stage to Moved out."; }
      else {
        title = "Decide on the extension"; text = "Agree with tenant and landlord before " + fmt(plusDays(t.Planned_Move_out_Date, -45)) + ". Extensions are charged at 9% of the extended period.";
        if (tenantMail) A.push({ label:"Ask the tenant", href: mailto(tenantMail, "Would you like to extend your stay at " + addr + "?", "Hi,\n\nYour stay at " + addr + " ends on " + fmt(t.Planned_Move_out_Date) + ". Would you like to extend it? Let us know the new end date and we will check it with the landlord.\n\nThanks,\nSpotahome Rental Management") });
        if (llMail) A.push({ label:"Ask the landlord", href: mailto(llMail, "Ampliación del alquiler · " + addr, "Hola,\n\nEl alquiler de " + addr + " termina el " + fmt(t.Planned_Move_out_Date) + ". ¿Te interesa ampliarlo si el inquilino lo pide? Si no, empezamos a buscar al siguiente inquilino.\n\nGracias,\nSpotahome Rental Management") });
        if (dl.Listing_URL) A.push({ label:"Open the listing", href: dl.Listing_URL });
      }
      break;
    case "Moved out":
      if (!t.Meter_Readings_Recorded || !t.Condition_Document_Signed) { title = "Close the move-out checks"; text = "Record the meter readings and the condition document, then tick both."; }
      else { title = "Settle the deposit"; text = "The landlord must return it within 30 days of the move-out (" + (t.Actual_Move_out_Date ? fmt(plusDays(t.Actual_Move_out_Date, 30)) : "date pending") + "). Tick Deposit settled when done."; }
      if (!t.Deposit_Settled && llMail) A.push({ label:"Email the landlord about the deposit", href: mailto(llMail, "Devolución de la fianza · " + addr, "Hola,\n\nEl inquilino de " + addr + " salió el " + fmt(t.Actual_Move_out_Date) + ". Según el documento de estado, ¿nos confirmas el importe de la fianza a devolver y si hay alguna deducción? El plazo legal es de 30 días.\n\nGracias,\nSpotahome Rental Management") });
      break;
    default: title = t.Stage === "Closed" ? "Tenancy closed" : "Cancelled"; text = "Nothing pending.";
  }
  if (prefsMissing && formLink) {
    A.push({ label:"Copy the preferences form link", copy: formLink });
    if (llMail) A.push({ label:"Email the form to the landlord", href: mailto(llMail, "Tus preferencias para " + (p.Property_Name || addr), "Hola,\n\nPara gestionar tu piso necesitamos tus preferencias (normas, llaves, seguro y reparaciones). Son unos 8 minutos:\n" + formLink + "\n\nGracias,\nSpotahome Rental Management") });
  }
  return { title, text, actions: A, warnings: W };
}

async function toggleCheck(t, field, val, el){
  const data = { id: t.id }; data[field] = val;
  if (field === "Contract_Signed") data.Contract_Signed_Date = val ? iso(today()) : null;
  if (field === "Deposit_Received") data.Deposit_Received_Date = val ? iso(today()) : null;
  if (field === "Deposit_Settled") data.Deposit_Settled_Date = val ? iso(today()) : null;
  if (!val && ["Contract_Signed","Deposit_Received","First_Rent_Paid"].includes(field) && GATE_STAGES.includes(t.Stage)) {
    if (!confirm("This tenancy is already '" + t.Stage + "'. Unticking a key-gate check means the keys should not have been handed over. Continue?")) { el.checked = true; return; }
  }
  try { await update("RM_Tenancies", data); Object.assign(t, data); toast("Saved."); render(); }
  catch(e) { el.checked = !val; showErr("Could not save: " + e.message); }
}
async function changeStage(t, stage, el){
  if (GATE_STAGES.includes(stage) && !gateOk(t)) {
    el.value = t.Stage;
    const miss = [!t.Contract_Signed && "contract signed", !t.Deposit_Received && "deposit received", !t.First_Rent_Paid && "first rent paid", !vettingOk(t) && "vetting accepted"].filter(Boolean).join(", ");
    showErr("Keys cannot be handed over yet. Missing: " + miss + ".");
    return;
  }
  if (STAGES.indexOf(stage) < STAGES.indexOf(t.Stage) && stage !== "Cancelled" && !confirm("Move " + t.Name + " back from " + t.Stage + " to " + stage + "?")) { el.value = t.Stage; return; }
  try { await update("RM_Tenancies", { id: t.id, Stage: stage }); t.Stage = stage; showErr(""); toast("Stage changed to " + stage + "."); render(); }
  catch(e) { el.value = t.Stage; showErr("Could not change the stage: " + e.message); }
}
